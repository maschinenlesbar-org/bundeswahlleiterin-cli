# The only repo-specific texts of the website. Everything else comes from the
# repository: the English intro from README.md, the commands from the built CLI.

# How the API is accessed: open | key (env: VAR) | account (token, user, password: VARs)
access:
  type: open

de:
  # German version of the README's intro paragraph. Keep it in step with README.md.
  intro: >-
    Die **amtlichen Ergebnisse der Bundestagswahl** direkt im Terminal abfragen. `bundeswahl`
    ist ein Kommandozeilen-Tool für die offenen Daten der
    [Bundeswahlleiterin](https://www.bundeswahlleiterin.de) zur **Bundestagswahl 2025**: Erst-
    und Zweitstimmenergebnisse nach Bund, Land und Wahlkreis, die Parteien, die 299 Wahlkreise
    und Strukturdaten je Wahlkreis – als sauberes JSON, das Sie direkt an
    [`jq`](https://jqlang.github.io/jq/) weitergeben können.
